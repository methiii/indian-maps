name: Refresh live data
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Fetch air quality
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python scripts/fetch_air.py
      - name: Save the new file
        run: |
          git config user.name "civiclens-robot"
          git config user.email "robot@users.noreply.github.com"
          git add data/air.json
          git diff --staged --quiet || git commit -m "Update air quality data"
          git push
